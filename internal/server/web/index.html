<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E9EDF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10152A" media="(prefers-color-scheme: dark)">
<meta name="description" content="העברת הלוח, תמונות וקבצים בין הטלפון למחשב.">
<title>CopyApp</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preload" href="/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script src="/i18n.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body data-view="loading">
<!-- Visible text comes from i18n.js: data-i18n (text), data-i18n-html (markup), data-i18n-attr (attributes). -->

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19.5h14"/></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4.5 3.5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M13.5 3.5H7.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8.5z"/><path d="M13.5 3.5v5h5"/></symbol>
  <symbol id="i-pc" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19.5V5m-6 6l6-6 6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11m0-11l-11 11"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5m0 3.2v.3"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5l7 2.6v5.4c0 4.4-3 7.7-7 9-4-1.3-7-4.6-7-9V6.1z"/><path d="M8.8 12l2.2 2.2 4.2-4.4"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4.5v3.8h-3.8"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></symbol>
  <symbol id="i-unlink" viewBox="0 0 24 24"><path d="M9.5 14.5l-1.8 1.8a3 3 0 0 1-4.2-4.2l2.6-2.6a3 3 0 0 1 4.2 0M14.5 9.5l1.8-1.8a3 3 0 0 1 4.2 4.2l-2.6 2.6a3 3 0 0 1-4.2 0M4 4l16 16"/></symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h1m3 0h1m3 0h1m3 0h.5M8 14h8"/></symbol>
</svg>

<!-- Loading -->
<section class="view view-loading" data-i18n-attr="aria-label:loading">
  <img class="loading-mark" src="/icon.svg" alt="" width="72" height="72">
</section>

<!-- Not paired -->
<section class="view view-pair" aria-labelledby="pair-title">
  <header class="pair-top">
    <span class="brand" dir="ltr"><img src="/icon.svg" alt="" width="28" height="28"> CopyApp</span>
    <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.label">
      <button type="button" data-lang="he" lang="he" aria-label="עברית" aria-pressed="true">עב</button>
      <button type="button" data-lang="ru" lang="ru" aria-label="Русский" aria-pressed="false">РУ</button>
      <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="pair-hero" aria-hidden="true">
    <div class="pair-monitor">
      <div class="pair-qr" id="pair-qr"></div>
    </div>
    <div class="pair-stand"></div>
    <div class="pair-phone"><span class="pair-finder"></span></div>
  </div>

  <h1 id="pair-title" class="pair-title" data-i18n="pair.title"></h1>
  <p class="pair-lead" id="pair-lead" data-i18n="pair.lead"></p>

  <ol class="pair-steps">
    <li><span class="step-n">1</span><p data-i18n-html="pair.s1"></p></li>
    <li><span class="step-n">2</span><p data-i18n-html="pair.s2"></p></li>
    <li><span class="step-n">3</span><p data-i18n-html="pair.s3"></p></li>
  </ol>

</section>

<!-- Connected -->
<section class="view view-main" aria-label="CopyApp">
  <header class="topbar">
    <span class="brand" dir="ltr"><img src="/icon.svg" alt="" width="28" height="28"><span class="brand-name">CopyApp</span></span>
    <span class="conn" id="conn" data-state="connecting">
      <span class="conn-dot" aria-hidden="true"></span><span class="conn-label" id="conn-label" data-i18n="conn.connecting"></span>
    </span>
    <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.label">
      <button type="button" data-lang="he" lang="he" aria-label="עברית" aria-pressed="true">עב</button>
      <button type="button" data-lang="ru" lang="ru" aria-label="Русский" aria-pressed="false">РУ</button>
      <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
    </div>
    <button class="icon-btn" type="button" data-open="sheet-settings" data-i18n-attr="aria-label:settings.aria">
      <svg class="ic" aria-hidden="true"><use href="#i-more"/></svg>
    </button>
  </header>

  <div class="banner" id="banner" role="status" hidden>
    <svg class="ic" aria-hidden="true"><use href="#i-retry"/></svg>
    <div class="banner-text">
      <b id="banner-title" data-i18n="banner.title"></b>
      <span id="banner-sub" data-i18n="banner.now"></span>
    </div>
    <button type="button" class="banner-btn" id="banner-retry" data-i18n="banner.retry"></button>
  </div>

  <main class="feed-wrap" id="feed-wrap">
    <!-- One-time tip after the first successful transfer. No certificate needed. -->
    <div class="tip-card" id="tip-card" role="status" hidden>
      <svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg>
      <div>
        <b data-i18n="tip.title"></b>
        <p data-i18n-html="tip.text"></p>
        <div class="tip-actions">
          <button type="button" class="btn btn-primary" id="tip-dismiss" data-i18n="tip.ok"></button>
          <button type="button" class="btn btn-ghost" data-open="sheet-cert" data-i18n="tip.app"></button>
        </div>
      </div>
    </div>

    <div class="empty" id="empty">
      <div class="empty-art" aria-hidden="true">
        <svg viewBox="0 0 220 120" class="empty-svg">
          <rect class="ea-pc" x="12" y="18" width="104" height="68" rx="8"/>
          <path class="ea-pc" d="M52 104h24M64 86v18"/>
          <rect class="ea-phone" x="160" y="26" width="46" height="80" rx="9"/>
          <path class="ea-phone" d="M176 96h14"/>
          <path class="ea-arc" d="M102 16 C126 -4, 160 -4, 182 24"/>
          <path class="ea-arc ea-arc-2" d="M154 108 C136 122, 118 118, 104 100"/>
          <rect class="ea-chip ea-chip-a" x="34" y="38" width="44" height="8" rx="4"/>
          <rect class="ea-chip ea-chip-b" x="34" y="54" width="28" height="8" rx="4"/>
        </svg>
      </div>
      <h2 class="empty-title" data-i18n="empty.title"></h2>
      <p class="empty-text" data-i18n-html="empty.t1"></p>
      <p class="empty-text" data-i18n-html="empty.t2"></p>
    </div>

    <ol class="feed" id="feed" data-i18n-attr="aria-label:feed.aria" aria-live="polite"></ol>
  </main>

  <footer class="dock">
    <button class="send-clip" type="button" id="send-clip">
      <span class="send-clip-icon" aria-hidden="true"><svg class="ic"><use href="#i-up"/></svg></span>
      <span class="send-clip-text">
        <span class="send-clip-label" data-i18n="dock.send"></span>
        <span class="send-clip-sub" data-i18n="dock.sendSub"></span>
      </span>
    </button>
    <div class="dock-row">
      <label class="dock-btn">
        <input type="file" id="pick-photo" accept="image/*,video/*" multiple class="vh">
        <svg class="ic" aria-hidden="true"><use href="#i-photo"/></svg><span data-i18n="dock.photo"></span>
      </label>
      <label class="dock-btn">
        <input type="file" id="pick-file" multiple class="vh">
        <svg class="ic" aria-hidden="true"><use href="#i-file"/></svg><span data-i18n="dock.file"></span>
      </label>
      <button class="dock-btn" type="button" data-open="sheet-paste">
        <svg class="ic" aria-hidden="true"><use href="#i-keyboard"/></svg><span data-i18n="dock.type"></span>
      </button>
    </div>
  </footer>
</section>

<!-- Sheets -->
<dialog class="sheet" id="sheet-settings" aria-labelledby="settings-title">
  <div class="sheet-grip" aria-hidden="true"></div>
  <h2 class="sheet-title" id="settings-title" data-i18n="settings.title"></h2>
  <div class="sheet-list">
    <div class="sheet-item sheet-item-static" id="verify-row">
      <svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg>
      <span><b data-i18n="settings.verify"></b><bdi class="verify-code" dir="ltr" data-fp-short>…</bdi><small data-i18n="settings.verifySub"></small></span>
    </div>
    <button type="button" class="sheet-item" id="app-row" data-open="sheet-cert">
      <svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg>
      <span><b data-i18n="settings.app"></b><small id="app-row-sub" data-i18n="settings.appSub"></small></span>
    </button>
    <button type="button" class="sheet-item sheet-item-danger" id="unpair-btn">
      <svg class="ic" aria-hidden="true"><use href="#i-unlink"/></svg>
      <span><b data-i18n="settings.unpair"></b><small data-i18n="settings.unpairSub"></small></span>
    </button>
  </div>
  <button type="button" class="btn btn-quiet btn-block" data-close data-i18n="done"></button>
</dialog>

<dialog class="sheet" id="sheet-cert" aria-labelledby="cert-title">
  <div class="sheet-grip" aria-hidden="true"></div>
  <h2 class="sheet-title" id="cert-title" data-i18n="cert.title"></h2>
  <p class="sheet-text" data-i18n="cert.text"></p>
  <div class="fp-check">
    <span class="fp-label" data-i18n="fp.label"></span>
    <p class="fp-short" data-i18n-attr="aria-label:fp.label"><bdi dir="ltr" data-fp-short>…</bdi></p>
    <p class="fp-note" data-i18n-html="cert.note"></p>
  </div>
  <a class="btn btn-primary btn-block" id="cert-download" href="/ca.crt" download="copyapp-ca.crt">
    <svg class="ic" aria-hidden="true"><use href="#i-download"/></svg> <span data-i18n="cert.download"></span>
  </a>
  <ol class="cert-steps">
    <li>
      <div class="mock" aria-hidden="true">
        <span class="mock-row" data-i18n="cert.m1a"></span><span class="mock-row mock-hit" data-i18n="cert.m1b"></span><span class="mock-row" data-i18n="cert.m1c"></span>
      </div>
      <p><span class="step-n">1</span><span data-i18n-html="cert.s1"></span></p>
    </li>
    <li>
      <div class="mock" aria-hidden="true">
        <span class="mock-row" data-i18n="cert.m2a"></span><span class="mock-row mock-hit" data-i18n="cert.m2b"></span><span class="mock-row" data-i18n="cert.m2c"></span>
      </div>
      <p><span class="step-n">2</span><span data-i18n-html="cert.s2"></span></p>
    </li>
    <li>
      <div class="mock" aria-hidden="true">
        <span class="mock-row mock-hit" data-i18n="cert.m3a"></span><span class="mock-row" data-i18n="cert.m3b"></span><span class="mock-row"><bdi>Wi‑Fi</bdi></span>
      </div>
      <p><span class="step-n">3</span><span data-i18n-html="cert.s3"></span></p>
    </li>
    <li>
      <div class="mock" aria-hidden="true">
        <span class="mock-row mock-dim" data-i18n="cert.m4a"></span><span class="mock-row mock-file"><bdi>copyapp-ca.crt</bdi></span><span class="mock-row"><bdi>IMG_2031.jpg</bdi></span>
      </div>
      <p><span class="step-n">4</span><span data-i18n-html="cert.s4"></span></p>
    </li>
  </ol>
  <p class="sheet-hint" data-i18n="cert.vary"></p>
  <p class="sheet-text cert-after" data-i18n-html="cert.after"></p>
  <p class="fingerprint" data-i18n-attr="aria-label:fp.full"><bdi dir="ltr" id="fingerprint">…</bdi></p>
  <button type="button" class="btn btn-quiet btn-block" data-close data-i18n="close"></button>
</dialog>

<dialog class="sheet" id="sheet-paste" aria-labelledby="paste-title">
  <div class="sheet-grip" aria-hidden="true"></div>
  <h2 class="sheet-title" id="paste-title" data-i18n="paste.title"></h2>
  <p class="sheet-text" id="paste-sub" data-i18n="paste.sub"></p>
  <form id="paste-form" class="paste-form">
    <label for="paste-text" class="vh" data-i18n="paste.label"></label>
    <textarea id="paste-text" rows="5" dir="auto" data-i18n-attr="placeholder:paste.ph" autocomplete="off"></textarea>
    <div class="paste-actions">
      <button type="button" class="btn btn-quiet" data-close data-i18n="cancel"></button>
      <button type="submit" class="btn btn-primary">
        <svg class="ic" aria-hidden="true"><use href="#i-up"/></svg> <span data-i18n="paste.send"></span>
      </button>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="sheet-confirm" aria-labelledby="confirm-title">
  <div class="sheet-grip" aria-hidden="true"></div>
  <h2 class="sheet-title" id="confirm-title" data-i18n="confirm.title"></h2>
  <p class="sheet-text" data-i18n="confirm.text"></p>
  <div class="paste-actions">
    <button type="button" class="btn btn-quiet" data-close data-i18n="confirm.keep"></button>
    <button type="button" class="btn btn-danger" id="confirm-unpair" data-i18n="confirm.unpair"></button>
  </div>
</dialog>

<div class="toasts" id="toasts" popover="manual"></div>
<div class="vh" id="alerts" role="alert" aria-live="assertive"></div>

<template id="tpl-in">
  <li class="msg msg-in">
    <div class="msg-meta"><svg class="ic" aria-hidden="true"><use href="#i-pc"/></svg><span class="msg-from" data-i18n="msg.from"></span><time class="msg-time"></time></div>
    <div class="card"></div>
  </li>
</template>
<template id="tpl-out">
  <li class="msg msg-out">
    <div class="msg-meta"><span class="msg-from" data-i18n="msg.to"></span><time class="msg-time"></time></div>
    <div class="card"></div>
  </li>
</template>
</body>
</html>
