name: Android companion
on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable development APK
        working-directory: android
        env:
          COPYAPP_VERSION: ${{ github.ref_name }}
          COPYAPP_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CopyApp-Android-development
          path: android/app/build/outputs/apk/debug/app-debug.apk
