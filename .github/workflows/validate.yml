name: validate

on:
  pull_request:
  push:
    branches: ['work/**']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled browser diagnostics
        run: |
          npm install --ignore-scripts
          npm run build:diagnostics
          npm run test:diagnostics
      - name: Vet and test
        shell: pwsh
        run: |
          go mod tidy
          if ($LASTEXITCODE) { exit 1 }
          go vet ./...
          if ($LASTEXITCODE) { exit 1 }
          go test -count=1 ./...
          if ($LASTEXITCODE) { exit 1 }
      - name: Build Windows application
        shell: pwsh
        run: ./build.ps1 -Version 0.0.0
